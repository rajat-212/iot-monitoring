<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple IoT World - Login</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            iot: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              dark: '#08140e'
            }
          }
        }
      }
    }
  </script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-emerald-50 text-slate-800 dark:bg-[#07130e] dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300">

  <!-- Top Navigation Bar / Theme Switcher -->
  <header class="w-full px-6 py-4 flex justify-between items-center max-w-6xl mx-auto">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-green-400 flex items-center justify-center text-white shadow-lg shadow-emerald-500/30">
        <i class="fa-solid fa-microchip text-xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-emerald-600 to-green-500 bg-clip-text text-transparent dark:from-emerald-400 dark:to-green-300">
          Simple IoT World
        </h1>
      </div>
    </div>
    
    <!-- Theme Toggle -->
    <button id="themeToggleBtn" type="button" aria-label="Toggle Theme" class="p-2.5 rounded-xl border border-emerald-200 dark:border-emerald-800/60 bg-white/80 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 hover:scale-105 transition-all shadow-sm">
      <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
    </button>
  </header>

  <!-- Centered Login Card -->
  <main class="flex-grow flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md bg-white/90 dark:bg-[#0d1e17]/95 border border-emerald-100 dark:border-emerald-900/60 shadow-2xl shadow-emerald-900/10 dark:shadow-emerald-950/50 rounded-3xl p-8 backdrop-blur-xl transition-all">
      
      <!-- Card Header -->
      <div class="text-center mb-8">
        <div class="inline-flex p-3 rounded-2xl bg-gradient-to-br from-emerald-500/10 to-green-500/20 text-emerald-500 mb-4 border border-emerald-500/20">
          <i class="fa-solid fa-lock-open text-2xl"></i>
        </div>
        <h2 class="text-3xl font-extrabold text-slate-800 dark:text-white tracking-tight">
          Simple IoT World
        </h2>
        <p class="text-sm text-emerald-600 dark:text-emerald-400/90 font-medium mt-1">
          Smart IoT Monitoring & Control
        </p>
      </div>

      <!-- Feedback Alert Box -->
      <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium border transition-all"></div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-5">
        <!-- Email Field -->
        <div>
          <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
            Email Address
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-emerald-500/70">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input 
              type="email" 
              id="email" 
              name="email" 
              required 
              placeholder="rajat@iot.com" 
              class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-[#081510] border border-slate-200 dark:border-emerald-900/70 rounded-xl text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600 text-sm"
            >
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
            Password
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-emerald-500/70">
              <i class="fa-solid fa-key"></i>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required 
              placeholder="••••••••" 
              class="w-full pl-10 pr-10 py-3 bg-slate-50 dark:bg-[#081510] border border-slate-200 dark:border-emerald-900/70 rounded-xl text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600 text-sm"
            >
            <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-emerald-500 transition-colors">
              <i class="fa-regular fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="loginBtn" 
          class="w-full py-3.5 px-4 bg-gradient-to-r from-emerald-600 via-emerald-500 to-green-500 hover:from-emerald-700 hover:to-green-600 text-white font-bold text-sm tracking-wider uppercase rounded-xl shadow-lg shadow-emerald-600/30 hover:shadow-emerald-600/50 hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center space-x-2"
        >
          <span id="loginBtnText">LOGIN</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <!-- Account Switcher Link -->
      <div class="mt-6 pt-6 border-t border-slate-100 dark:border-emerald-950/80 text-center">
        <p class="text-sm text-slate-500 dark:text-slate-400">
          Don't have an account? 
          <a href="/register.html" class="font-semibold text-emerald-600 dark:text-emerald-400 hover:underline hover:text-emerald-500 ml-1">
            Create Account
          </a>
        </p>
      </div>

      <!-- Quick Hint for testing -->
      <div class="mt-4 p-3 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-xs text-emerald-700 dark:text-emerald-300/80 text-center">
        Demo Login: <span class="font-bold">rajat@iot.com</span> | Password: <span class="font-bold">admin123</span>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full py-6 px-4 text-center border-t border-emerald-100 dark:border-emerald-950/60 bg-white/40 dark:bg-[#07130e]/40 text-xs sm:text-sm text-slate-500 dark:text-slate-400">
    <p class="leading-relaxed">
      Developed with Love <span class="pulse-heart text-base">❤️</span> by <span class="font-semibold text-emerald-600 dark:text-emerald-400">Rajat Raut and Team</span>.
    </p>
    <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">
      Department of ETC, SB Jain, Nagpur
    </p>
  </footer>

  <script src="/js/login.js"></script>
</body>
</html>
